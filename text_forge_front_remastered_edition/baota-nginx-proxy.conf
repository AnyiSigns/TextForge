# 宝塔 Nginx 反代配置（前端 Next.js + 后端 Docker）
#
# 用法（宝塔）：
#   1) 软件商店 → Nginx → 配置，确认 http 段里已有类似：
#        map $http_upgrade $connection_upgrade { default upgrade; '' close; }
#      若没有，把下面「全局段」加到 Nginx 主配置 http 内（不要放进 server）。
#   2) 网站 → 设置 → 配置文件，在已有的 server { ... } 内，
#      删掉 宝塔默认的 location / 及静态文件 location 规则，
#      替换为下面「站点段」的两段（listen / server_name / ssl / 证书 等保留 宝塔自动生成的）。
#
# 前提：
#   - 后端 Docker 已在本机运行，API 监听 127.0.0.1:8000
#   - 前端已运行（pnpm start），监听 127.0.0.1:3000
#   - 前端构建时必须用 NEXT_PUBLIC_API_URL=/api（不要用 .env.local 的 localhost:8000）

# ============ 全局段（放到 Nginx 主配置 http 内，仅一次）============
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ============ 站点段（放进 宝塔网站 server { } 内）============

# 后端 API：转发到本机 Docker 后端 8000，关闭缓冲以支持 SSE 流式 + WebSocket
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # SSE 流式生成必须：关闭缓冲 + 长超时，否则前端转圈不输出
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 其余流量：前端 Next.js（next start 监听 127.0.0.1:3000）
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
